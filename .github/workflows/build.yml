name: Build MapArt Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract mapart-builder-mod.zip (if present)
        run: |
          ZIP_PATH=$(find . -maxdepth 2 -iname "mapart-builder-mod.zip" | head -n 1)

          if [ -n "$ZIP_PATH" ]; then
            echo "Tim thay zip tai: $ZIP_PATH, dang giai nen..."
            unzip -o "$ZIP_PATH" -d _extracted
          else
            echo "Khong tim thay mapart-builder-mod.zip, bo qua buoc giai nen."
          fi

      - name: Locate project root (folder containing gradle.properties)
        id: find_root
        run: |
          # Tim file gradle.properties o bat ky dau trong repo (ke ca sau khi giai nen zip),
          # loai tru thu muc .git, roi lay thu muc chua no lam project root.
          GRADLE_PROPS=$(find . -name "gradle.properties" -not -path "*/.git/*" | head -n 1)

          if [ -z "$GRADLE_PROPS" ]; then
            echo "ERROR: Khong tim thay gradle.properties o bat ky dau trong repo."
            echo "Kiem tra lai cau truc thu muc da push len GitHub."
            find . -maxdepth 3 -not -path "*/.git/*"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$GRADLE_PROPS")
          echo "Tim thay project root tai: $PROJECT_ROOT"
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Resolve exact Yarn mappings build for this Minecraft version
        working-directory: ${{ steps.find_root.outputs.root }}
        run: |
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          echo "Minecraft version: $MC_VERSION"

          if [ -z "$MC_VERSION" ]; then
            echo "ERROR: Khong doc duoc minecraft_version tu gradle.properties"
            exit 1
          fi

          YARN_VERSION=$(curl -s "https://meta.fabricmc.net/v2/versions/yarn/${MC_VERSION}" | \
            python3 -c "import sys, json; data = json.load(sys.stdin); print(data[0]['version']) if data else exit(1)")

          if [ -z "$YARN_VERSION" ]; then
            echo "ERROR: Khong tim thay yarn mapping cho Minecraft $MC_VERSION"
            exit 1
          fi

          echo "Resolved yarn version: $YARN_VERSION"
          sed -i "s/^yarn_mappings=.*/yarn_mappings=${YARN_VERSION}/" gradle.properties
          echo "--- gradle.properties sau khi cap nhat ---"
          cat gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper (if missing)
        working-directory: ${{ steps.find_root.outputs.root }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10
          fi
          chmod +x gradlew

      - name: Build mod
        working-directory: ${{ steps.find_root.outputs.root }}
        run: ./gradlew build --stacktrace --no-daemon

      - name: Locate built jar
        id: locate
        working-directory: ${{ steps.find_root.outputs.root }}
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Built jar: $JAR_PATH"

      - name: Upload built mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mapart-builder-mod
          path: ${{ steps.find_root.outputs.root }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
